[pytest]
; auto: lets us write plain `async def test_...()` functions (and the explicit
; @pytest.mark.asyncio ones in test_executor.py both work) without extra boilerplate.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
; Registering the "integration" marker silences "unknown marker" warnings for the
; DB-touching tests in test_search_integration.py, which are skipped unless a real
; Postgres+pgvector instance is reachable (see that file's skip condition).
markers =
    integration: requires a real Postgres+pgvector database (see docker-compose.yml)
