# Alembic configuration file. Alembic is the migration tool: it diffs/tracks changes
# to app/db/models.py and turns them into versioned SQL scripts under alembic/versions/.
# Run `alembic upgrade head` to apply all pending migrations to DATABASE_URL.

[alembic]
# Where migration scripts live.
script_location = alembic
# So alembic/env.py can `import app.*` when run from the repo root.
prepend_sys_path = .
# Placeholder - the real URL is injected at runtime from Settings.database_url inside
# alembic/env.py (via get_settings()), so this value is never actually used.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
